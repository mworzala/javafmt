name: Setup CI runner
description: >
  Free disk space, install Java + Gradle, and (optionally) cache the IntelliJ
  Platform download. The caller is responsible for checking out the repo first
  (this composite action lives in the repo, so it can't run before checkout).

inputs:
  cache-intellij:
    description: Whether to restore/save the IntelliJ Platform cache. Set to 'false' for jobs that don't build plugin-idea.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # IntelliJ is big :-(
    # Removing the preinstalled Android SDK frees ~14GB via a single rm -rf — plenty
    # for the IDE distribution + Gradle caches. Skip the apt-based `large-packages`
    # removal which is what dominates the original ~3 min step.
    - name: Free disk space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: false
        haskell: false
        large-packages: false
        docker-images: false
        swap-storage: false

    - uses: actions/setup-java@v5
      with:
        distribution: 'graalvm'
        java-version: '25'

    # Cache the IntelliJ Platform download separately from setup-gradle's cache.
    # Keyed on plugin-idea/build.gradle.kts so unrelated build-script churn
    # doesn't invalidate the multi-GB IDE blob.
    - name: Cache IntelliJ Platform
      if: inputs.cache-intellij == 'true'
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches/modules-2/files-2.1/com.jetbrains.intellij.idea
          ~/.gradle/caches/modules-2/files-2.1/com.jetbrains.intellij.platform
        key: intellij-${{ runner.os }}-${{ hashFiles('plugin-idea/build.gradle.kts') }}
        restore-keys: |
          intellij-${{ runner.os }}-

    - uses: gradle/actions/setup-gradle@v6
