name: Publish Release
on:
  release:
    types: [created]

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: ./.github/actions/setup-ci-runner

      - run: ./gradlew build
      # TODO: re-enable once the project self-check passes.
      # - run: ./gradlew :cli:run --args='check .'

  publish:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
          # Need history + tags so the plugin-idea diff check can find the previous release.
          fetch-depth: 0
      - uses: ./.github/actions/setup-ci-runner

      - name: Check whether plugin-idea changed since the previous release
        id: plugin_idea
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          prev=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          if [ -z "$prev" ]; then
            echo "No previous tag found; publishing plugin-idea."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif ! git diff --quiet "$prev" "$TAG" -- plugin-idea/; then
            echo "plugin-idea/ changed since $prev; publishing."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "plugin-idea/ unchanged since $prev; skipping plugin build, upload, and publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish api and core to Maven Central
        run: ./gradlew :api:publishToMavenCentral :core:publishToMavenCentral
        env:
          JAVAFMT_VERSION: ${{ github.event.release.tag_name }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USER }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_KEY_PASSWORD }}

      - name: Publish Gradle plugin to Plugin Portal
        run: ./gradlew :plugin-gradle:publishPlugins
        env:
          JAVAFMT_VERSION: ${{ github.event.release.tag_name }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

      - name: Build CLI release artifact
        run: ./gradlew :cli:shadowJar
        env:
          JAVAFMT_VERSION: ${{ github.event.release.tag_name }}

      - name: Build IntelliJ plugin artifact
        if: steps.plugin_idea.outputs.changed == 'true'
        run: ./gradlew :plugin-idea:buildPlugin
        env:
          JAVAFMT_VERSION: ${{ github.event.release.tag_name }}

      - name: Upload CLI jar to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" \
            "cli/build/libs/javafmt-${TAG}.jar" \
            --clobber

      - name: Upload IntelliJ plugin zip to release
        if: steps.plugin_idea.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" \
            "plugin-idea/build/distributions/javafmt-idea-${TAG}.zip" \
            --clobber

      - name: Publish IntelliJ plugin to JetBrains Marketplace
        if: steps.plugin_idea.outputs.changed == 'true'
        run: ./gradlew :plugin-idea:publishPlugin
        env:
          JAVAFMT_VERSION: ${{ github.event.release.tag_name }}
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
