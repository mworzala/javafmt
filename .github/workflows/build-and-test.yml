name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: 'graalvm'
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6

        # IntelliJ is big :-(
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - run: ./gradlew build
      - run: ./gradlew test
      - run: ./gradlew :black-cli:run --args='check .'
